name: object_detector_yolo
description: App Android que captura foto e envia ao servidor YOLO via socket TCP.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.1
  image: ^4.5.4
  image_picker: ^1.1.2
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.3
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
